<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, system-ui, sans-serif">
  <title>Machine à états finis du firmware PB-0326 v4.0.1</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="14" fill="#ffffff"/>

  <!-- ── Flèches ── -->
  <g fill="none" stroke="#6b7280" stroke-width="1.6">
    <path d="M178 170 H214" marker-end="url(#fl)"/>
    <path d="M368 170 H404" marker-end="url(#fl)"/>
    <path d="M558 170 H594" marker-end="url(#fl)"/>
    <path d="M748 150 H814" marker-end="url(#fl)"/>
    <path d="M814 192 H754" marker-end="url(#fl)"/>
    <!-- PAUSE → BUFFER (GO 3 s) -->
    <path d="M895 122 V72 H483 V116" marker-end="url(#fl)"/>
    <!-- CHECK : boucle sur lui-même -->
    <path d="M268 122 C268 78, 320 78, 320 116" marker-end="url(#fl)"/>
  </g>
  <g fill="none" stroke="#b91c1c" stroke-width="1.6">
    <path d="M673 224 V318" marker-end="url(#flr)"/>
    <path d="M598 372 H104 V230" marker-end="url(#flr)"/>
  </g>

  <!-- ── Étiquettes des transitions ── -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="196" y="160">3 s</text>
    <text x="386" y="252">capteurs OK</text>
    <text x="386" y="267">+ GO</text>
    <text x="576" y="160">GO</text>
    <text x="781" y="141">GO 2 s</text>
    <text x="781" y="211">GO court</text>
    <text x="689" y="64">GO 3 s (retour en attente)</text>
    <text x="294" y="66">capteur absent :</text>
    <text x="294" y="80" fill="#6b7280">nouveau scan</text>
  </g>
  <path d="M386 236 V200" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-size="12" fill="#b91c1c">
    <text x="684" y="266">T ≥ 40 °C</text>
    <text x="684" y="281">ou capteur perdu</text>
    <text x="684" y="296">(3 lectures ratées)</text>
    <text x="350" y="364" text-anchor="middle">GO 1 s → redémarrage de l'ESP32</text>
  </g>

  <!-- ── États ── -->
  <g font-size="11.5" fill="#4b5563">
    <!-- INIT -->
    <rect x="30" y="122" width="148" height="100" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
    <text x="44" y="146" font-size="10" fill="#6b7280" letter-spacing="1">ÉTAT 0</text>
    <text x="44" y="166" font-size="16" font-weight="600" fill="#111">INIT</text>
    <text x="44" y="188">Variables initialisées</text>
    <text x="44" y="204">Écran d'accueil</text>

    <!-- CHECK -->
    <rect x="220" y="122" width="148" height="100" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
    <text x="234" y="146" font-size="10" fill="#6b7280" letter-spacing="1">ÉTAT 1</text>
    <text x="234" y="166" font-size="16" font-weight="600" fill="#111">CHECK</text>
    <text x="234" y="188">Scan I²C toutes les 2 s</text>
    <text x="234" y="204">SHT35 · SCD40</text>

    <!-- BUFFER -->
    <rect x="410" y="122" width="148" height="100" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
    <text x="424" y="146" font-size="10" fill="#6b7280" letter-spacing="1">ÉTAT 2</text>
    <text x="424" y="166" font-size="16" font-weight="600" fill="#111">BUFFER</text>
    <text x="424" y="188">Mesures en direct</text>
    <text x="424" y="204">Ventilateur ON</text>

    <!-- MARCHE -->
    <rect x="600" y="122" width="148" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="614" y="146" font-size="10" fill="#2563eb" letter-spacing="1">ÉTAT 3</text>
    <text x="614" y="166" font-size="16" font-weight="600" fill="#111">MARCHE</text>
    <text x="614" y="188">Régulation T et CO₂</text>
    <text x="614" y="204">Chronomètre</text>

    <!-- PAUSE -->
    <rect x="820" y="122" width="150" height="100" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
    <text x="834" y="146" font-size="10" fill="#6b7280" letter-spacing="1">ÉTAT 4</text>
    <text x="834" y="166" font-size="16" font-weight="600" fill="#111">PAUSE</text>
    <text x="834" y="188">Résistance OFF</text>
    <text x="834" y="204">Ventilateur ON</text>

    <!-- ERREUR -->
    <rect x="600" y="322" width="148" height="100" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
    <text x="614" y="346" font-size="10" fill="#b91c1c" letter-spacing="1">ÉTAT 5</text>
    <text x="614" y="366" font-size="16" font-weight="600" fill="#111">ERREUR</text>
    <text x="614" y="388">Actionneurs coupés</text>
    <text x="614" y="404">LED rouge + buzzer</text>
  </g>

  <text x="30" y="452" font-size="11" fill="#9ca3af">Diagramme établi à partir du firmware v4.0.1 · GO = bouton unique (appui court ou maintenu)</text>
</svg>
