<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="34" font-size="18" font-weight="600" fill="#1d1f23">Shield I²C M2446 — bus et périphériques (programme final)</text>
<rect x="30" y="70" width="240" height="330" rx="9" fill="#f3f4f6" stroke="#3b3f46" stroke-width="1.6"/>
<text x="42" y="92" font-weight="600" fill="#1d1f23">Arduino MEGA 1280</text>
<text x="42" y="112" fill="#4b515b" font-size="12">I²C : SDA (20), SCL (21)</text>
<text x="42" y="130" fill="#4b515b" font-size="12">Écran SPI logiciel : D2 à D6</text>
<text x="42" y="148" fill="#4b515b" font-size="12">Boutons UP / DOWN / ENTER / EXIT :</text>
<text x="42" y="166" fill="#4b515b" font-size="12" xml:space="preserve">   D8 / D9 / D10 / D11</text>
<text x="42" y="184" fill="#4b515b" font-size="12">Haut-parleur : D7</text>
<text x="42" y="202" fill="#4b515b" font-size="12">EEPROM interne 4 Ko :</text>
<text x="42" y="220" fill="#4b515b" font-size="12" xml:space="preserve">   température, heure, états du MCP</text>
<line x1="270" y1="150" x2="930" y2="150" stroke="#2563eb" stroke-width="3"/><text x="900" y="142" fill="#2563eb" font-weight="600">SDA</text>
<line x1="270" y1="180" x2="930" y2="180" stroke="#b45309" stroke-width="3"/><text x="900" y="200" fill="#b45309" font-weight="600">SCL</text>
<text x="285" y="137" font-size="11" fill="#5b616b">résistances de tirage (pull-up) vers VCC</text>
<line x1="370" y1="150" x2="370" y2="250" stroke="#2563eb" stroke-width="2"/><line x1="390" y1="180" x2="390" y2="250" stroke="#b45309" stroke-width="2"/>
<circle cx="370" cy="150" r="4" fill="#2563eb"/><circle cx="390" cy="180" r="4" fill="#b45309"/>
<rect x="320" y="250" width="130" height="100" rx="9" fill="#fff" stroke="#3b3f46" stroke-width="1.6"/>
<text x="332" y="272" font-weight="600" fill="#1d1f23">MCP23017</text>
<text x="332" y="292" fill="#4b515b" font-size="12">adresse 0x27</text>
<text x="332" y="310" fill="#4b515b" font-size="12">8 entrées (GPA)</text>
<text x="332" y="328" fill="#4b515b" font-size="12">8 sorties (GPB)</text>
<line x1="530" y1="150" x2="530" y2="250" stroke="#2563eb" stroke-width="2"/><line x1="550" y1="180" x2="550" y2="250" stroke="#b45309" stroke-width="2"/>
<circle cx="530" cy="150" r="4" fill="#2563eb"/><circle cx="550" cy="180" r="4" fill="#b45309"/>
<rect x="480" y="250" width="130" height="100" rx="9" fill="#fff" stroke="#3b3f46" stroke-width="1.6"/>
<text x="492" y="272" font-weight="600" fill="#1d1f23">MCP9808</text>
<text x="492" y="292" fill="#4b515b" font-size="12">adresse 0x18</text>
<text x="492" y="310" fill="#4b515b" font-size="12">capteur de</text>
<text x="492" y="328" fill="#4b515b" font-size="12">température</text>
<line x1="690" y1="150" x2="690" y2="250" stroke="#2563eb" stroke-width="2"/><line x1="710" y1="180" x2="710" y2="250" stroke="#b45309" stroke-width="2"/>
<circle cx="690" cy="150" r="4" fill="#2563eb"/><circle cx="710" cy="180" r="4" fill="#b45309"/>
<rect x="640" y="250" width="130" height="100" rx="9" fill="#fff" stroke="#3b3f46" stroke-width="1.6"/>
<text x="652" y="272" font-weight="600" fill="#1d1f23">DS3231</text>
<text x="652" y="292" fill="#4b515b" font-size="12">adresse 0x68</text>
<text x="652" y="310" fill="#4b515b" font-size="12">horloge temps réel</text>
<text x="652" y="328" fill="#4b515b" font-size="12">(RTC)</text>
<line x1="850" y1="150" x2="850" y2="250" stroke="#2563eb" stroke-width="2"/><line x1="870" y1="180" x2="870" y2="250" stroke="#b45309" stroke-width="2"/>
<circle cx="850" cy="150" r="4" fill="#2563eb"/><circle cx="870" cy="180" r="4" fill="#b45309"/>
<rect x="800" y="250" width="130" height="100" rx="9" fill="#fff" stroke="#3b3f46" stroke-width="1.6"/>
<text x="812" y="272" font-weight="600" fill="#1d1f23">Connecteur</text>
<text x="812" y="292" fill="#4b515b" font-size="12">adresse 4 pôles</text>
<text x="812" y="310" fill="#4b515b" font-size="12">GND SCL SDA VCC</text>
<text x="812" y="328" fill="#4b515b" font-size="12">extension</text>
<rect x="320" y="400" width="290" height="80" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="332" y="422" font-weight="600" fill="#1d1f23">Écran OLED SSD1351 128×128 (SPI)</text>
<text x="332" y="442" fill="#4b515b" font-size="12">hors bus I²C, piloté par D2 à D6</text>
<rect x="640" y="400" width="290" height="80" rx="9" fill="#fff" stroke="#3b3f46" stroke-width="1.6"/>
<text x="652" y="422" font-weight="600" fill="#1d1f23">Points de mesure SDA / SCL / GND</text>
<text x="652" y="442" fill="#4b515b" font-size="12">pour l'oscilloscope</text>
<line x1="270" y1="440" x2="318" y2="440" stroke="#3b3f46" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30" y="505" font-size="12" fill="#5b616b">Adresses lues dans le programme (MCP23017, MCP9808) et fixées par le fabricant (DS3231).</text>
</svg>