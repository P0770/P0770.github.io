<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Inter, system-ui, sans-serif">
  <title>Architecture du serveur auto-hébergé : accès web par tunnel Cloudflare, sans port ouvert</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="#fff"/>

  <!-- Internet -->
  <rect x="24" y="70" width="150" height="74" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="99" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Utilisateurs</text>
  <text x="99" y="120" text-anchor="middle" font-size="11.5" fill="#6b7280">navigateur, application</text>
  <text x="99" y="135" text-anchor="middle" font-size="11.5" fill="#6b7280">mobile Nextcloud</text>

  <!-- Cloudflare -->
  <rect x="230" y="60" width="200" height="94" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Cloudflare</text>
  <text x="330" y="106" text-anchor="middle" font-size="11.5" fill="#4b5563">DNS + proxy (HTTPS)</text>
  <text x="330" y="122" text-anchor="middle" font-size="11.5" fill="#4b5563">cloud.mondomaine</text>
  <text x="330" y="138" text-anchor="middle" font-size="11.5" fill="#4b5563">media.mondomaine</text>
  <path d="M174 107 H224" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Box -->
  <rect x="480" y="40" width="120" height="134" rx="10" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="540" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Box</text>
  <text x="540" y="90" text-anchor="middle" font-size="11.5" fill="#4b5563">internet</text>
  <text x="540" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">aucun port</text>
  <text x="540" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">ouvert</text>

  <!-- Tunnel -->
  <path d="M430 140 C 520 210, 700 190, 800 238" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="640" y="180" font-size="11.5" fill="#b45309">tunnel chiffré, ouvert depuis le Pi vers Cloudflare</text>

  <!-- Raspberry Pi -->
  <rect x="200" y="226" width="776" height="270" rx="14" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="222" y="256" font-size="14" font-weight="600" fill="#111">Raspberry Pi 5 — Raspberry Pi OS Lite 64 bits — Docker</text>

  <rect x="790" y="238" width="160" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="870" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">cloudflared</text>
  <text x="870" y="274" text-anchor="middle" font-size="11" fill="#6b7280">client du tunnel</text>

  <g font-size="12.5" fill="#111">
    <rect x="230" y="320" width="160" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="310" y="345" text-anchor="middle" font-weight="600">Nextcloud</text>
    <text x="310" y="364" text-anchor="middle" font-size="11" fill="#6b7280">cloud familial</text>
    <rect x="420" y="320" width="160" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="500" y="345" text-anchor="middle" font-weight="600">Jellyfin</text>
    <text x="500" y="364" text-anchor="middle" font-size="11" fill="#6b7280">médiathèque</text>
    <rect x="610" y="320" width="160" height="62" rx="8" fill="#f7f7f8" stroke="#d1d5db"/>
    <text x="690" y="345" text-anchor="middle" font-weight="600">Portainer</text>
    <text x="690" y="364" text-anchor="middle" font-size="11" fill="#6b7280">administration</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.4" fill="none">
    <path d="M800 276 C 600 300, 400 296, 330 316" marker-end="url(#a)"/>
    <path d="M815 284 C 700 300, 560 300, 520 316" marker-end="url(#a)"/>
  </g>

  <!-- SSD -->
  <rect x="230" y="414" width="540" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="500" y="438" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">SSD NVMe 1 To (ext4, monté au démarrage)</text>
  <text x="500" y="457" text-anchor="middle" font-size="11" fill="#4b5563">données Nextcloud · configuration et bibliothèques Jellyfin (Films, Séries, Famille)</text>
  <g stroke="#86efac" stroke-width="1.4"><path d="M310 382 V414"/><path d="M500 382 V414"/><path d="M690 382 V414"/></g>

  <!-- Partage Nextcloud -> Jellyfin -->
  <path d="M390 340 H416" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="405" y="396" text-anchor="middle" font-size="10.5" fill="#15803d">dossier partagé</text>

  <!-- Admin SSH -->
  <rect x="800" y="320" width="150" height="62" rx="8" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="875" y="345" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111">SSH</text>
  <text x="875" y="364" text-anchor="middle" font-size="11" fill="#6b7280">réseau local uniquement</text>

  <text x="24" y="512" font-size="10.5" fill="#9ca3af">Noms de domaine et adresses remplacés par des valeurs génériques.</text>
</svg>
