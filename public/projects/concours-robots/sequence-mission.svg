<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" font-family="Inter, system-ui, sans-serif">
  <title>Déroulement de la mission : échanges Bluetooth entre le robot maître et le robot esclave</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="980" height="880" rx="14" fill="#fff"/>

  <!-- En-têtes -->
  <rect x="150" y="24" width="250" height="58" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="275" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#111">MAÎTRE — grand robot</text>
  <text x="275" y="68" text-anchor="middle" font-size="12" fill="#4b5563">Arduino Mega · caserne · pont · pompe</text>
  <rect x="580" y="24" width="250" height="58" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="705" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#111">ESCLAVE — petit robot</text>
  <text x="705" y="68" text-anchor="middle" font-size="12" fill="#4b5563">Arduino Uno · camion · MPU6050 · bobine</text>

  <!-- Lignes de vie -->
  <path d="M275 82 V840" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M705 82 V840" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Colonne états -->
  <g font-size="10.5" fill="#6b7280" letter-spacing="1">
    <text x="24" y="122">ÉTAT 0</text>
    <text x="24" y="182">ÉTAT 1</text>
    <text x="24" y="366">ÉTAT 2</text>
    <text x="24" y="436">ÉTAT 3</text>
    <text x="24" y="636">ÉTAT 4</text>
    <text x="24" y="706">ÉTAT 5</text>
  </g>
  <g stroke="#e5e7eb"><path d="M20 150 H960"/><path d="M20 340 H960"/><path d="M20 410 H960"/><path d="M20 610 H960"/><path d="M20 680 H960"/><path d="M20 790 H960"/></g>

  <!-- État 0 -->
  <rect x="165" y="100" width="220" height="40" rx="8" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="275" y="117" text-anchor="middle" font-size="12" fill="#111">Appui sur START</text>
  <text x="275" y="132" text-anchor="middle" font-size="11" fill="#4b5563">servo : le tube est déposé dans l'eau</text>

  <!-- État 1 -->
  <path d="M275 172 H699" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="487" y="166" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1e40af">ETAT1</text>
  <rect x="300" y="190" width="380" height="64" rx="8" fill="none" stroke="#0f766e" stroke-dasharray="4 3"/>
  <text x="310" y="204" font-size="10.5" fill="#0f766e">en boucle, toutes les 50 ms</text>
  <path d="M705 228 H281" stroke="#0f766e" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="487" y="222" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#115e59">G:&lt;vitesse de rotation °/s&gt;</text>
  <text x="487" y="246" text-anchor="middle" font-size="11" fill="#4b5563">(le petit robot est encore à bord du grand)</text>
  <rect x="120" y="262" width="310" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="275" y="280" text-anchor="middle" font-size="12" fill="#111">Cap reconstruit par intégration + PID</text>
  <text x="275" y="297" text-anchor="middle" font-size="11" fill="#4b5563">1,5 s lent → 6,3 s rapide → lent jusqu'au</text>
  <text x="275" y="313" text-anchor="middle" font-size="11" fill="#4b5563">bord (interrupteur de fin de course)</text>
  <path d="M275 332 H699" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="487" y="326" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1e40af">STOP_ANGLE</text>

  <!-- État 2 -->
  <rect x="165" y="352" width="220" height="44" rx="8" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="275" y="370" text-anchor="middle" font-size="12" fill="#111">Déploiement du pont</text>
  <text x="275" y="386" text-anchor="middle" font-size="11" fill="#4b5563">treuil, durée fixe 3,6 s</text>

  <!-- État 3 -->
  <path d="M275 432 H699" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="487" y="426" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1e40af">ETAT3</text>
  <rect x="580" y="448" width="250" height="110" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="705" y="467" text-anchor="middle" font-size="12" fill="#111">Traversée et approche</text>
  <text x="705" y="486" text-anchor="middle" font-size="11" fill="#4b5563">4 s sur le pont (vitesse réduite)</text>
  <text x="705" y="502" text-anchor="middle" font-size="11" fill="#4b5563">15 s à pleine vitesse</text>
  <text x="705" y="518" text-anchor="middle" font-size="11" fill="#4b5563">lent jusqu'au bord (interrupteur)</text>
  <text x="705" y="540" text-anchor="middle" font-size="11" fill="#4b5563">le tuyau se déroule de la bobine</text>
  <path d="M705 586 H281" stroke="#0f766e" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="487" y="580" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#115e59">FIN_ETAT</text>

  <!-- État 4 -->
  <rect x="165" y="622" width="220" height="44" rx="8" fill="#f7f7f8" stroke="#d1d5db"/>
  <text x="275" y="640" text-anchor="middle" font-size="12" fill="#111">Pompe péristaltique 24 V</text>
  <text x="275" y="656" text-anchor="middle" font-size="11" fill="#4b5563">l'eau part dans le tuyau (≈ 30 s)</text>

  <!-- État 5 -->
  <path d="M275 702 H699" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="487" y="696" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#1e40af">ETAT5</text>
  <rect x="580" y="716" width="250" height="34" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="705" y="738" text-anchor="middle" font-size="12" fill="#111">Recul pendant 3 s</text>
  <path d="M705 770 H281" stroke="#0f766e" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="487" y="764" text-anchor="middle" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#115e59">FIN_ETAT</text>

  <!-- Sécurité -->
  <rect x="120" y="806" width="740" height="48" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="490" y="826" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">À tout moment : bouton STOP ou perte du Bluetooth</text>
  <text x="490" y="843" text-anchor="middle" font-size="11.5" fill="#991b1b">→ retour à l'état 0, tous les moteurs et la pompe sont coupés</text>
</svg>
