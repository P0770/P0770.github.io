<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="34" font-size="18" font-weight="600" fill="#1d1f23">Compteur de bouteilles — câblage (version C++)</text>
<rect x="60" y="70" width="200" height="480" rx="10" fill="#f3f4f6" stroke="#3b3f46" stroke-width="2"/>
<text x="160.0" y="100" text-anchor="middle" font-size="16" font-weight="600" fill="#1d1f23">ESP32</text>

<circle cx="260" cy="130" r="5" fill="#2563eb"/>
<text x="248" y="134" text-anchor="end" fill="#1d1f23">GPIO 2 (SDA)</text>
<circle cx="260" cy="160" r="5" fill="#2563eb"/>
<text x="248" y="164" text-anchor="end" fill="#1d1f23">GPIO 15 (SCL)</text>
<circle cx="260" cy="230" r="5" fill="#b45309"/>
<text x="248" y="234" text-anchor="end" fill="#1d1f23">GPIO 13</text>
<circle cx="260" cy="300" r="5" fill="#047857"/>
<text x="248" y="304" text-anchor="end" fill="#1d1f23">GPIO 22</text>
<circle cx="260" cy="340" r="5" fill="#047857"/>
<text x="248" y="344" text-anchor="end" fill="#1d1f23">GPIO 23</text>
<circle cx="260" cy="410" r="5" fill="#15803d"/>
<text x="248" y="414" text-anchor="end" fill="#1d1f23">GPIO 19</text>
<circle cx="260" cy="450" r="5" fill="#b91c1c"/>
<text x="248" y="454" text-anchor="end" fill="#1d1f23">GPIO 21</text>
<text x="76" y="490" fill="#5b616b">USB · 3V3 → OLED, capteur</text>
<text x="76" y="512" fill="#5b616b">GND → masse commune</text>
<rect x="560" y="105" width="300" height="80" rx="8" fill="#ffffff" stroke="#3b3f46" stroke-width="1.5"/>
<text x="574" y="127" font-weight="600" fill="#1d1f23">Écran OLED SSD1306 128×64</text>
<text x="574" y="145" fill="#5b616b">I²C, adresse 0x3C · 3V3 / GND</text>
<rect x="560" y="205" width="300" height="60" rx="8" fill="#ffffff" stroke="#3b3f46" stroke-width="1.5"/>
<text x="574" y="227" font-weight="600" fill="#1d1f23">Capteur IR réflectif</text>
<text x="574" y="245" fill="#5b616b">sortie à LOW quand une bouteille passe</text>
<rect x="560" y="282" width="300" height="80" rx="8" fill="#ffffff" stroke="#3b3f46" stroke-width="1.5"/>
<text x="574" y="304" font-weight="600" fill="#1d1f23">Boutons-poussoirs (vers GND)</text>
<text x="574" y="322" fill="#5b616b">22 : Marche/Arrêt · 23 : Remise à zéro</text>
<rect x="560" y="385" width="300" height="90" rx="8" fill="#ffffff" stroke="#3b3f46" stroke-width="1.5"/>
<text x="574" y="407" font-weight="600" fill="#1d1f23">LED + résistance série (vers GND)</text>
<text x="574" y="425" fill="#5b616b">19 : verte, comptage actif</text>
<text x="574" y="443" fill="#5b616b">21 : rouge, bouteille détectée</text>
<line x1="265" y1="130" x2="560" y2="130" stroke="#2563eb" stroke-width="2"/>
<line x1="265" y1="160" x2="560" y2="160" stroke="#2563eb" stroke-width="2"/>
<line x1="265" y1="230" x2="560" y2="230" stroke="#b45309" stroke-width="2"/>
<line x1="265" y1="300" x2="560" y2="300" stroke="#047857" stroke-width="2"/>
<line x1="265" y1="340" x2="560" y2="340" stroke="#047857" stroke-width="2"/>
<line x1="265" y1="410" x2="560" y2="410" stroke="#15803d" stroke-width="2"/>
<line x1="265" y1="450" x2="560" y2="450" stroke="#b91c1c" stroke-width="2"/>
<text x="550" y="294" text-anchor="end" font-size="11" fill="#5b616b">pull-up interne</text>
<text x="30" y="582" font-size="12" fill="#5b616b">Les boutons utilisent les résistances de tirage internes de l’ESP32 (INPUT_PULLUP) : appui = niveau LOW.</text>
</svg>