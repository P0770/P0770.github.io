<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b3f46"/></marker></defs>
<text x="30" y="34" font-size="18" font-weight="600" fill="#1d1f23">Machine d'état imposée par le cahier des charges</text>
<rect x="60" y="90" width="180" height="70" rx="35" fill="#f3f4f6" stroke="#3b3f46" stroke-width="2"/>
<text x="150" y="120" text-anchor="middle" font-weight="600" font-size="15" fill="#1d1f23">Stop</text>
<text x="150" y="140" text-anchor="middle" fill="#4b515b" font-size="12">machine à l'arrêt</text>
<rect x="360" y="90" width="180" height="70" rx="35" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="450" y="120" text-anchor="middle" font-weight="600" font-size="15" fill="#1d1f23">Wait</text>
<text x="450" y="140" text-anchor="middle" fill="#4b515b" font-size="12">attend une bille</text>
<rect x="660" y="90" width="180" height="70" rx="35" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="750" y="120" text-anchor="middle" font-weight="600" font-size="15" fill="#1d1f23">Busy</text>
<text x="750" y="140" text-anchor="middle" fill="#4b515b" font-size="12">bille dans la maquette</text>
<rect x="360" y="330" width="180" height="70" rx="35" fill="#fdf2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="450" y="360" text-anchor="middle" font-weight="600" font-size="15" fill="#1d1f23">Default</text>
<text x="450" y="380" text-anchor="middle" fill="#4b515b" font-size="12">défaut actif</text>
<path d="M240,115 H356" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="298" y="107" text-anchor="middle" font-size="12" fill="#1d1f23">Marche</text>
<path d="M540,115 H656" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="598" y="107" text-anchor="middle" font-size="12" fill="#1d1f23">bille à</text><text x="598" y="135" text-anchor="middle" font-size="12" fill="#1d1f23">l'entrée</text>
<path d="M750,90 C750,62 450,62 450,86" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="600" y="46" text-anchor="middle" font-size="12" fill="#1d1f23">bille sortie (maquette du dessous en Wait)</text>
<path d="M450,162 V326" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="0" y="0" text-anchor="middle" font-size="12" fill="#1d1f23"></text>
<text x="460" y="250" font-size="12" fill="#1d1f23">arrêt d'urgence</text><text x="460" y="266" font-size="12" fill="#1d1f23">ou bourrage (25 s)</text>
<path d="M745,162 L545,340" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="0" y="0" text-anchor="middle" font-size="12" fill="#1d1f23"></text>
<path d="M140,162 L360,350" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="0" y="0" text-anchor="middle" font-size="12" fill="#1d1f23"></text>
<path d="M360,380 C200,380 130,300 140,166" fill="none" stroke="#3b3f46" stroke-width="1.8" marker-end="url(#a)"/>
<text x="128" y="262" text-anchor="end" font-size="12" fill="#1d1f23">quittance (Set)</text>
<text x="30" y="440" font-size="12" fill="#5b616b">Le contact sec « Wait » informe la maquette du dessus ; un solénoïde retient la bille en sortie tant que la maquette du dessous n'est pas en Wait.</text>
</svg>